locale: en
time-format: "dd/MM/yyyy HH:mm:ss"
main:
  update:
    check: true
    auto: false
whitelist:
  status: false # Whitelist enabled
  remove-on-expired: false # Remove player from database on join if their time has expired
  kick-on-remove: false # Kick player from server when removed from the whitelist via command
  bypass:
    permission: # Permission to bypass whitelist join restrictions
      enabled: true # Enable bypass via permission
      permission: mwl.whitelist.bypass # Players with this permission can join regardless of whitelist status
  player-check: # Periodically re-checks online players and kicks them if no longer whitelisted or expired
    enabled: false
    initial-delay: 0 # Delay before the first check, in milliseconds
    delay: 60000 # Delay between checks, in milliseconds
  expired-notify: # Warns a player once their remaining time drops below expired-notify.time
    enabled: true
    time: 86400000 # Threshold before expiry, in milliseconds
database:
  type: JSON # Database type (JSON, MONGO)
  mongodb: # MongoDB settings
    url: "mongodb://admin:admin@127.0.0.1/mwl" # Connection url
    name: "mwl" # Database name
    collections: # Collections name's
      users: "users" # Users collection